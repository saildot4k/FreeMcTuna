name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v2.0.0
    steps:
      - name: Install dependencies
        run: |
          apk add build-base git zip
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compile
        run: |
          make
      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      # (Optional) Keep artifact upload if needed separately
      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OPENTUNAtoPS2BBL-BAREBONES_${{ env.sha8 }}
          path: OPENTUNAtoPS2BBL-BAREBONES.ELF

      # Ensure release step can find the ELF file
      - name: Debug - Check ELF file exists
        run: ls -lah OPENTUNAtoPS2BBL-BAREBONES.ELF

      - name: Move latest release tag
        if: github.ref == 'refs/heads/UMCS'
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin latest

      - name: Create release
        if: github.ref == 'refs/heads/UMCS'
        uses: ncipollo/release-action@v1.21.0
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "latest"
          prerelease: false
          name: "OpenTuna w/ PS2BBL & OSDMenu"
          artifacts: OPENTUNAtoPS2BBL*.ELF
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
