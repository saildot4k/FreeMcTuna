name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v2.0.0
    steps:
      - name: Install dependencies
        run: |
          apk add build-base git zip

      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set build metadata
        run: |
          artifact="$(awk -F= '/^EE_BIN_PACKED[[:space:]]*=/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' Makefile)"
          expected="OPENTUNAtoPS2BBL-BAREBONES.ELF"

          if [ -z "$artifact" ]; then
            echo "Could not determine EE_BIN_PACKED from Makefile." >&2
            exit 1
          fi
          if [ "$artifact" != "$expected" ]; then
            echo "Expected $expected from Makefile, got $artifact." >&2
            exit 1
          fi

          echo "RELEASE_ARTIFACT=$artifact" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=latest" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=OpenTuna to PS2BBL latest builds" >> "$GITHUB_ENV"

      - name: Compile
        run: |
          make

      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_ENV"

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}_${{ env.sha8 }}
          path: ${{ env.RELEASE_ARTIFACT }}

      - name: Debug - Check ELF file exists
        run: ls -lah "${RELEASE_ARTIFACT}"

      - name: Move latest release tag
        if: github.ref == 'refs/heads/UMCS'
        run: |
          git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push -f origin "${RELEASE_TAG}"

      - name: Create release
        if: github.ref == 'refs/heads/UMCS'
        uses: ncipollo/release-action@v1.21.0
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "${{ env.RELEASE_TAG }}"
          prerelease: false
          name: "${{ env.RELEASE_NAME }}"
          artifacts: "${{ env.RELEASE_ARTIFACT }}"
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          makeLatest: true
